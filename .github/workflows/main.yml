name: Build LeEco Smart Remote APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools build-tools;36.0.0"

      - name: Install Android API 37 platform
        shell: bash
        run: |
          set +e
          for name in "platforms;android-37" "platforms;android-37.0"; do
            for ch in 0 1 2 3; do
              echo "Trying $name on channel $ch"
              if sdkmanager --channel=$ch "$name"; then
                echo "Installed $name"
                exit 0
              fi
            done
          done
          echo "::error::Could not install Android API 37"
          sdkmanager --list --channel=3 | grep -i "android-37" || true
          exit 1

      - name: Check project files
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          echo "Required project files found."

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK_PATH" || { echo "::error::APK was not generated."; exit 1; }
          ls -lh "$APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LeEcoSmartRemote-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
